# ---- Verify Email Template ---- #

subject: "Verify your ExamAI account"

body: |
  Hi {{ username }},

  Welcome to ExamAI

  Please verify your email address to activate your account.

  Verification link:
  {{ verification_link }}

  If you didn’t create this account, you can ignore this email.

html: |
  <!DOCTYPE html>
  <html>
    <body style="font-family: Arial, sans-serif; line-height: 1.6;">
      
      <h2 style="color:#111;">Welcome to ExamAI</h2>

      <p>Hi <strong>{{ username }}</strong>,</p>

      <p>
        Thanks for signing up. To activate your account, please verify your email address.
      </p>

      <p style="margin: 20px 0;">
        <a href="{{ verification_link }}" 
           style="background:#4f46e5;color:#fff;padding:10px 16px;
                  text-decoration:none;border-radius:6px;">
          Verify Email
        </a>
      </p>

      <p style="font-size: 12px; color: #666;">
        If the button doesn’t work, copy and paste this link:<br/>
        {{ verification_link }}
      </p>

      <hr/>

      <p style="font-size: 12px; color: #999;">
        If you didn’t create this account, you can safely ignore this email.
      </p>

    </body>
  </html>