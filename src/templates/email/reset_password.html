# ---- Reset Password Template ---- #

subject: "Reset Your Password"

body: |
  Hi {{ username }},
  Reset your password here: {{ reset_link }}

html: |
  <!DOCTYPE html>
  <html>
    <body>
      <h2>Password Reset</h2>
      <p>Hello {{ username }}</p>
      <a href="{{ reset_link }}">Reset Password</a>
    </body>
  </html>
