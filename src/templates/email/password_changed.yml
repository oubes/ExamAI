# ---- Password Changed Successfully Template ---- #

subject: "Your ExamAI password was changed"

body: |
  Hi {{ username }},

  Your ExamAI password was changed successfully.

  If you made this change, no further action is required.

  If you did NOT change your password, please secure your account immediately.

html: |
  <!DOCTYPE html>
  <html>
    <body style="font-family: Arial, sans-serif; line-height: 1.6;">

      <h2 style="color:#111;">Password Changed Successfully</h2>

      <p>Hi <strong>{{ username }}</strong>,</p>

      <p>
        Your ExamAI password has been updated successfully.
      </p>

      <p>
        If this was you, you can safely ignore this email.
      </p>

      <p style="margin: 20px 0;">
        <span style="
          background:#16a34a;
          color:#fff;
          padding:10px 16px;
          border-radius:6px;
          display:inline-block;
          font-weight:bold;
        ">
          Password Updated
        </span>
      </p>

      <hr/>

      <p style="font-size: 12px; color: #999;">
        ⚠️ If you did not make this change, reset your password immediately
        and review your account activity.
      </p>

    </body>
  </html>