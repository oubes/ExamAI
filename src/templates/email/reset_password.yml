# ---- Reset Password Template ---- #

subject: "Reset your ExamAI password"

body: |
  Hi {{ username }},

  We received a request to reset your ExamAI password.

  Reset your password using the link below:
  {{ reset_link }}

  This link will expire soon for security reasons.

  If you didn’t request this, you can safely ignore this email.

html: |
  <!DOCTYPE html>
  <html>
    <body style="font-family: Arial, sans-serif; line-height: 1.6;">

      <h2 style="color:#111;">Password Reset Request</h2>

      <p>Hi <strong>{{ username }}</strong>,</p>

      <p>
        We received a request to reset your ExamAI password.
      </p>

      <p>
        Click the button below to create a new password:
      </p>

      <p style="margin: 20px 0;">
        <a href="{{ reset_link }}"
           style="background:#dc2626;color:#fff;padding:10px 16px;
                  text-decoration:none;border-radius:6px;">
          Reset Password
        </a>
      </p>

      <p style="font-size: 12px; color: #666;">
        If the button doesn’t work, copy and paste this link:<br/>
        {{ reset_link }}
      </p>

      <hr/>

      <p style="font-size: 12px; color: #999;">
        ⚠️ This link will expire soon for your security.<br/>
        If you didn’t request this reset, you can ignore this email safely.
      </p>

    </body>
  </html>