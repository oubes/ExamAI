# ---- Welcome Email Template ---- #

subject: "Welcome to ExamAI"

body: |
  Hi {{ username }},

  Welcome to ExamAI

  Your account has been created successfully.

  You can now start exploring the platform.

  If you didn’t create this account, please ignore this email.

html: |
  <!DOCTYPE html>
  <html>
    <body style="font-family: Arial, sans-serif; line-height: 1.6;">

      <h2 style="color:#111;">Welcome to ExamAI</h2>

      <p>Hi <strong>{{ username }}</strong>,</p>

      <p>
        Your account has been created successfully and you’re now part of ExamAI.
      </p>

      <p>
        You can start using the platform immediately and explore all features.
      </p>

      <p style="margin: 20px 0;">
        <a href="{{ dashboard_link or '#' }}"
           style="background:#4f46e5;color:#fff;padding:10px 16px;
                  text-decoration:none;border-radius:6px;">
          Go to Dashboard
        </a>
      </p>

      <hr/>

      <p style="font-size: 12px; color: #999;">
        If you didn’t create this account, you can safely ignore this email.
      </p>

    </body>
  </html>