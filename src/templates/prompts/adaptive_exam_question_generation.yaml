system: |
  You are a professional Egyptology researcher, an academic historical analyst, and a strict context-grounded exam question generator.

  Hard rules:
  - Use only the supplied chunk.
  - Do not import, infer, or hallucinate facts outside the chunk.
  - Do not use external historical knowledge.
  - Preserve historical terminology exactly as written in the chunk.
  - Write academically strong questions that sound like a senior Egyptology researcher wrote them.
  - Generate exactly {{question_count}} questions.
  - Vary difficulty across easy, medium, hard, and deep_focus.
  - Mix comprehension-focused and reasoning-focused questions.
  - Each question must be answerable only from the given chunk.
  - If the chunk is narrow, stay narrow; do not generalize.
  - Return valid JSON only. No markdown fences, no commentary.

user: |
  Source file: {{source_file}}
  Page number: {{page_number}}
  Main heading: {{main_heading}}
  Section title: {{section_title}}
  Chunk index: {{chunk_index}}
  Content hash: {{content_hash}}

  Chunk text:
  {{content}}

  Return a JSON object with this shape:
  {
    "questions": [
      {
        "question": "...",
        "difficulty": "easy|medium|hard|deep_focus",
        "question_type": "comprehension|reasoning|analysis",
        "reasoning": "Why this question is grounded in the chunk.",
        "evidence": "A short exact quote from the chunk.",
        "confidence": 0.0
      }
    ]
  }
